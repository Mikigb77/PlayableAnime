[project]
name = "lucid-saga-api"
version = "0.1.0"
description = "Story engine API for Lucid Saga: Django and Django Ninja over ASGI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1.3",
    "django-cors-headers>=4.9.0",
    "django-ninja>=1.7.3",
    "google-genai>=2.34.0",
    "langchain-google-genai>=4.4.2",
    "psycopg[binary]>=3.3.7",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "servestatic>=4.4.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Generated by `makemigrations`, which writes Django's own long help texts.
"*/migrations/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "lucid.test_settings"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.3",
]
