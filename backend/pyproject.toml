[project]
name = "playable-anime-api"
version = "0.1.0"
description = "Story engine API for the PlayableAnime app"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "google-genai>=2.34.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
