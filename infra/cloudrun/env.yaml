# Plain settings for the API service and the migration job on Cloud Run (docs/DEPLOY.md).
#
# Every deploy replaces all plain env vars with this file, so a variable removed here is removed
# from the service. Never put a secret here: secrets come from Secret Manager (T11), and deploy.sh
# adds DATABASE_URL and DJANGO_SECRET_KEY from there.
#
# deploy.sh also adds GCP_PROJECT and MEDIA_BUCKET from infra/config.sh, and ALLOWED_HOSTS and
# CSRF_TRUSTED_ORIGINS from the service's own URLs, so don't set those four here.
#
# Values must be quoted strings.

LLM_PROVIDER: "vertex"
VERTEX_LOCATION: "global"
LOG_LEVEL: "INFO"
# The owner role comes only from a verified Google sign-in with this email (K7).
OWNER_EMAILS: "mikigb77@gmail.com"

# Fill these in once they exist, in a PR:
# GOOGLE_OAUTH_CLIENT_IDS: ""   # Web, Android and iOS client ids, comma-separated (T8)
# CORS_ORIGINS: ""              # origins of the hosted web build, comma-separated
# The model for each node (B6, M8) uses the backend's defaults unless set here.
