# Plain settings for the API service and the migration job on Cloud Run (docs/DEPLOY.md).
#
# Every deploy replaces all plain env vars with this file, so a variable removed here is removed
# from the service. Never put a secret here: secrets come from Secret Manager (T11), and deploy.sh
# adds DATABASE_URL and DJANGO_SECRET_KEY from there.
#
# deploy.sh also adds GCP_PROJECT, MEDIA_BUCKET and GOOGLE_OAUTH_CLIENT_IDS (the Google sign-in
# clients, T8) from infra/config.sh, and ALLOWED_HOSTS and CSRF_TRUSTED_ORIGINS from the service's
# own URLs, so don't set those five here.
#
# Values must be quoted strings.

# The published app always runs on Gemini through Vertex AI: on Cloud Run the API refuses to start
# with any other provider (B6).
LLM_PROVIDER: "vertex"
VERTEX_LOCATION: "global"
LOG_LEVEL: "INFO"
# The owner role comes only from a verified Google sign-in with this email (K7).
OWNER_EMAILS: "mikigb77@gmail.com"

# Fill this in once it exists, in a PR:
# CORS_ORIGINS: ""              # origins of the hosted web build, comma-separated
# Each graph node's model and thinking level (B6, M8), such as NARRATOR_MODEL or INTERPRET_THINKING,
# keeps its default in backend/graph/llm/config.py unless set here.
