name: playable_anime
description: "Lucid Saga, an endless AI story game."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.2
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  http: ^1.6.0
  intl: any
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  speech_to_text: ^7.5.0
  record: ^7.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Generates AppLocalizations from lib/l10n/*.arb (see l10n.yaml).
  generate: true

  assets:
    # Pictures the fake API serves in API_MODE=fake (lib/core/fake/).
    - assets/fake/
    # The privacy policy, a copy of docs/PRIVACY.md (T12).
    - assets/legal/

  # Bundled so nothing loads at runtime. Static Latin subsets of the variable fonts from Google
  # Fonts, under the SIL Open Font License (assets/fonts/*-OFL.txt). See DESIGN.md.
  fonts:
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Regular.ttf
        - asset: assets/fonts/Literata-Italic.ttf
          style: italic
        - asset: assets/fonts/Literata-SemiBold.ttf
          weight: 600
    - family: LiterataDisplay
      fonts:
        - asset: assets/fonts/LiterataDisplay-Medium.ttf
          weight: 500
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
