# Dependabot keeps the dependencies current and patched (docs/DEPLOY.md#dependabot).
#
# Alerts and security updates are switched on in the repository's settings: a security update
# opens a PR into the default branch, dev, as soon as an advisory affects a dependency, and never
# waits. The version updates below open their PRs into dev too, like every PR, once a week: the
# minor and patch updates of each ecosystem together in one PR, each major update in its own. A
# new release waits 7 days before it is offered, so a broken or hijacked release is usually pulled
# before it reaches us.
#
# The Android build's Gradle plugins (app/android) are left out: their versions follow Flutter's,
# so they move when Flutter does.
version: 2

updates:
  # The API's Python packages: backend/pyproject.toml and uv.lock.
  - package-ecosystem: uv
    directory: /backend
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      backend:
        update-types: [minor, patch]

  # The API image's base and uv. The python:3.13-slim tag already brings Python's patch releases
  # with each build, and moving to a newer Python is a PR of its own, so Dependabot doesn't offer it.
  - package-ecosystem: docker
    directory: /backend
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      backend-image:
        update-types: [minor, patch]

  # The Flutter app's packages: app/pubspec.yaml and pubspec.lock.
  - package-ecosystem: pub
    directory: /app
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      app:
        update-types: [minor, patch]

  # The actions the workflows use. They stay pinned to a commit with the version in a comment, and
  # Dependabot updates both.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]

  # The Neon CLI's project config (neon.ts), a local tool only, so once a month is enough.
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      neon:
        update-types: [minor, patch]
