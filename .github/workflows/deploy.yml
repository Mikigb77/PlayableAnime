# Deploys everything from main (T13). See docs/DEPLOY.md.
#
# Every PR goes into dev, and merging dev into main is the deploy: the push to main starts this.
# It can also be started by hand on main, for a dry run or to deploy main again.
#
# 1. CI must have passed on this exact commit; this waits for it.
# 2. Sign in to Google Cloud through Workload Identity Federation, with no key (B11).
# 3. Build the backend image once and push it to Artifact Registry.
# 4. Run migrations as a Cloud Run job over the direct database URL (T2).
# 5. Deploy the service to europe-west3 and move all traffic to it (T1, B10).
# 6. Check /health. If it or any step since the deploy began fails, roll traffic back.
# 7. Let anyone call the API, which checks sign-in itself (T8), unless API_ACCESS is private.
# 8. Call each model the app uses once, as the service would (check_models). A model Vertex AI
#    refuses fails the run with its reason, without rolling back: the code isn't at fault.
# 9. Draw the starter covers that are missing, in a job of its own whose failure doesn't fail the
#    deploy.
# A failed job prints its own logs here, so the reason shows in GitHub.
# Meanwhile the Android app is built, and once the API is up it is published as the latest
# GitHub release's lucid-saga.apk, which the README links, and uploaded to the releases bucket,
# where the installed app finds it and updates itself (S12).
#
# "Dry run" signs in, checks the setup and builds the image and the APK, then only prints the rest.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (sign in, check and build, but push and deploy nothing)
        type: boolean
        default: false

permissions: {}

# One deploy at a time, and a queued one is never replaced by a dry run, which has its own queue.
concurrency:
  group: deploy-production${{ inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: false

jobs:
  ci-green:
    name: CI passed on this commit
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: infra/require-green-ci.sh
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    name: ${{ inputs.dry_run && 'Dry run' || 'Deploy' }}
    needs: ci-green
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: config
        run: infra/deploy.sh github-outputs

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ steps.config.outputs.project_id }}
          workload_identity_provider: ${{ steps.config.outputs.wif_provider }}
          service_account: ${{ steps.config.outputs.deployer_sa }}
          token_format: access_token

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      # The owner's emails (K7) come from a secret only to keep them out of the public repo.
      - name: Check the bootstrap
        run: infra/deploy.sh preflight
        env:
          OWNER_EMAILS: ${{ secrets.OWNER_EMAILS }}

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: ${{ !inputs.dry_run }}
        with:
          registry: ${{ steps.config.outputs.registry_host }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: build
        name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          platforms: linux/amd64
          push: ${{ !inputs.dry_run }}
          provenance: false
          tags: ${{ steps.config.outputs.image }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: image
        name: Pin the image by digest
        env:
          IMAGE: ${{ steps.config.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ -n "$DRY_RUN" ]; then
            echo "ref=$IMAGE:$GITHUB_SHA" >>"$GITHUB_OUTPUT"
          elif [ -n "$DIGEST" ]; then
            echo "ref=$IMAGE@$DIGEST" >>"$GITHUB_OUTPUT"
          else
            echo "::error::The build returned no digest, so the job and the service can't be pinned to the same image."
            exit 1
          fi

      - name: Run migrations
        run: infra/deploy.sh migrate "$IMAGE_REF"
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          OWNER_EMAILS: ${{ secrets.OWNER_EMAILS }}

      - id: service
        name: Deploy the service
        run: infra/deploy.sh service "$IMAGE_REF"
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          OWNER_EMAILS: ${{ secrets.OWNER_EMAILS }}

      # Minted here, not earlier: a federated ID token lasts only 10 minutes.
      - id: id_token
        if: ${{ !inputs.dry_run }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ steps.config.outputs.wif_provider }}
          service_account: ${{ steps.config.outputs.deployer_sa }}
          token_format: id_token
          id_token_audience: ${{ steps.service.outputs.url }}
          id_token_include_email: true
          create_credentials_file: false
          export_environment_variables: false

      - id: smoke
        name: Check /health
        if: ${{ !inputs.dry_run }}
        run: infra/deploy.sh smoke "$SERVICE_URL"
        env:
          SERVICE_URL: ${{ steps.service.outputs.url }}
          SMOKE_ID_TOKEN: ${{ steps.id_token.outputs.id_token }}

      - id: access
        name: Decide who may call the API
        run: infra/deploy.sh access
        env:
          API_ACCESS: ${{ vars.API_ACCESS }}

      # Any failure once the deploy step has started, including the smoke test, but not a failure to
      # change who may call the API: the new revision is healthy then, and rolling back won't help.
      - name: Roll back to the previous revision
        if: ${{ failure() && steps.service.outputs.previous_revision != '' && steps.access.outcome != 'failure' }}
        run: infra/deploy.sh rollback "$PREVIOUS_REVISION"
        env:
          PREVIOUS_REVISION: ${{ steps.service.outputs.previous_revision }}

  # About 4 cents, most of it one small picture. A failure turns the run red so it is seen, and
  # leaves the new revision serving, since rolling back wouldn't make a refused model answer.
  models:
    name: Check the models
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: config
        run: infra/deploy.sh github-outputs

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ steps.config.outputs.project_id }}
          workload_identity_provider: ${{ steps.config.outputs.wif_provider }}
          service_account: ${{ steps.config.outputs.deployer_sa }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - run: infra/deploy.sh models

  # Skips the covers that exist, so only the first deploy draws (about $0.37 in all). Its own job,
  # so the APK doesn't wait for it, and a failure here doesn't fail the deploy. It runs after the
  # model check, which it would fail the same way, so each job's logs are its own.
  covers:
    name: Draw the starter covers
    needs: models
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    env:
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: config
        run: infra/deploy.sh github-outputs

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ steps.config.outputs.project_id }}
          workload_identity_provider: ${{ steps.config.outputs.wif_provider }}
          service_account: ${{ steps.config.outputs.deployer_sa }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - run: infra/deploy.sh covers

  # Runs alongside CI and the deploy. Nothing is published unless both pass.
  apk:
    name: Build the Android app
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      signing: ${{ steps.build.outputs.signing }}
      sha1: ${{ steps.build.outputs.sha1 }}
      version_name: ${{ steps.build.outputs.version_name }}
      version_code: ${{ steps.build.outputs.version_code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.5
          cache: true

      # Signed with the release keystore from the repository's secrets, or with the debug key when
      # there are none (docs/DEPLOY.md). The run number is the versionCode, so it always grows.
      - id: build
        name: Build the APK
        run: infra/build-apk.sh "$RUNNER_TEMP/lucid-saga.apk"
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lucid-saga-apk
          path: ${{ runner.temp }}/lucid-saga.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the Android app
    needs: [deploy, apk]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lucid-saga-apk
          path: ${{ runner.temp }}/apk

      - name: Publish the latest release
        run: infra/publish-apk.sh "$RUNNER_TEMP/apk/lucid-saga.apk"
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ needs.apk.outputs.version_code }}
          VERSION_NAME: ${{ needs.apk.outputs.version_name }}
          SIGNING: ${{ needs.apk.outputs.signing }}
          SIGNING_SHA1: ${{ needs.apk.outputs.sha1 }}

      # After the GitHub release, so the README's link has the new build even if this fails.
      - id: config
        run: infra/deploy.sh github-outputs

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ steps.config.outputs.project_id }}
          workload_identity_provider: ${{ steps.config.outputs.wif_provider }}
          service_account: ${{ steps.config.outputs.deployer_sa }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Offer it to the installed apps
        run: infra/deploy.sh upload-apk "$RUNNER_TEMP/apk/lucid-saga.apk"
        env:
          BUILD_NUMBER: ${{ needs.apk.outputs.version_code }}
          VERSION_NAME: ${{ needs.apk.outputs.version_name }}
