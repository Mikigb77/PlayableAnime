name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # pytest-django creates and drops its own test database in this throwaway container.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  # The story evals in deterministic mode (T15, T17, T18): every scenario the engine alone decides,
  # played through the real turn graph with scripted model answers. No model, no database, no key.
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run python -m evals run --out evals-out
      - if: always()
        run: test -f evals-out/summary.md && cat evals-out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-deterministic
          path: backend/evals-out
          if-no-files-found: ignore
          retention-days: 14

  backend-image:
    # Builds the Cloud Run image and runs it as Cloud Run would: migrate, then serve on $PORT.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lucid-api .
      - run: docker run --rm --network host -e DJANGO_SECRET_KEY=ci -e DATABASE_URL=$DB lucid-api python manage.py migrate
      - name: Serve and smoke-test
        run: |
          docker run -d --name api --network host -e PORT=8080 -e DJANGO_SECRET_KEY=ci -e DATABASE_URL=$DB lucid-api
          for i in $(seq 1 30); do curl -sf localhost:8080/health && break; sleep 1; done
          curl -sf localhost:8080/health
          # Every endpoint but /health and /v1/auth/* needs a signed-in player (T8).
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/v1/stories)" = 401
          TOKEN=$(curl -sf -X POST localhost:8080/v1/auth/register -H 'Content-Type: application/json' \
            -d '{"email": "ci@example.com", "password": "a long ci passphrase", "display_name": "CI", "birth_date": "1990-01-01"}' \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["access_token"])')
          AUTH="Authorization: Bearer $TOKEN"
          # Stories come from drafts; seed_story makes one without a model, ready for its opening.
          STORY=$(docker run --rm --network host -e DJANGO_SECRET_KEY=ci -e DATABASE_URL=$DB lucid-api \
            python manage.py seed_story ci@example.com)
          curl -sf localhost:8080/v1/stories -H "$AUTH" | grep -q "$STORY"
          curl -sf "localhost:8080/v1/stories/$STORY" -H "$AUTH" > /dev/null
          curl -sf "localhost:8080/v1/stories/$STORY/memory" -H "$AUTH" > /dev/null
          curl -sf localhost:8080/v1/premises -H "$AUTH" > /dev/null
          curl -sf localhost:8080/static/admin/css/base.css > /dev/null
      - if: always()
        run: docker logs api || true

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.5
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  # The deploy scripts and workflows (docs/DEPLOY.md). No credentials: gcloud, gh and curl are
  # fakes in the tests, and the real gcloud runs offline and signed out to check every flag.
  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x infra/*.sh infra/tests/*.sh infra/tests/fakes/*
      # Only the deploy workflow: the other workflows belong to other work and aren't held to it.
      - run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color .github/workflows/deploy.yml
      - run: infra/tests/run.sh
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - run: infra/tests/check-gcloud-flags.sh
