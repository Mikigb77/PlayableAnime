name: CI

# Every PR goes into dev, and merging dev into main deploys (docs/DEPLOY.md). CI runs on every PR
# and on pushes to both; the deploy waits for this workflow's run on the main commit it deploys.
on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # pytest-django creates and drops its own test database in this throwaway container.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  # The story evals in deterministic mode (T15, T17, T18): every scenario the engine alone decides,
  # played through the real turn graph with scripted model answers. No model, no database, no key.
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run python -m evals run --out evals-out
      - if: always()
        run: test -f evals-out/summary.md && cat evals-out/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evals-deterministic
          path: backend/evals-out
          if-no-files-found: ignore
          retention-days: 14

  backend-image:
    # Builds the Cloud Run image and runs it as Cloud Run would: migrate, then serve on $PORT.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t lucid-api .
      # The old FastAPI app's tables may still be in Neon production. Migrations must leave them and
      # their rows alone: dropping that data needs Miki (CLAUDE.md).
      - name: Add the old app's tables
        run: docker run --rm --network host -v "$PWD/tests/fixtures:/fixtures:ro" postgres:18 psql "$DB" -v ON_ERROR_STOP=1 -q -f /fixtures/legacy_fastapi.sql
      - run: docker run --rm --network host -e DJANGO_SECRET_KEY=ci -e DATABASE_URL="$DB" lucid-api python manage.py migrate
      - name: Check the old app's tables are untouched
        run: |
          rows=$(docker run --rm --network host postgres:18 psql "$DB" -tA -c \
            "select (select count(*) from stories where id = 'legacy-1') || ',' || (select count(*) from schema_migrations)")
          test "$rows" = "1,1" || { echo "::error::A migration changed the old app's tables (got $rows)."; exit 1; }
      - name: Serve and smoke-test
        run: |
          docker run -d --name api --network host -e PORT=8080 -e DJANGO_SECRET_KEY=ci -e DATABASE_URL="$DB" lucid-api
          for _ in $(seq 1 30); do curl -sf localhost:8080/health && break; sleep 1; done
          curl -sf localhost:8080/health
          # Every endpoint but /health and /v1/auth/* needs a signed-in player (T8).
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/v1/stories)" = 401
          TOKEN=$(curl -sf -X POST localhost:8080/v1/auth/register -H 'Content-Type: application/json' \
            -d '{"email": "ci@example.com", "password": "a long ci passphrase", "display_name": "CI", "birth_date": "1990-01-01"}' \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["access_token"])')
          AUTH="Authorization: Bearer $TOKEN"
          # Stories come from drafts; seed_story makes one without a model, ready for its opening.
          STORY=$(docker run --rm --network host -e DJANGO_SECRET_KEY=ci -e DATABASE_URL="$DB" lucid-api \
            python manage.py seed_story ci@example.com)
          curl -sf localhost:8080/v1/stories -H "$AUTH" | grep -q "$STORY"
          curl -sf "localhost:8080/v1/stories/$STORY" -H "$AUTH" > /dev/null
          curl -sf "localhost:8080/v1/stories/$STORY/memory" -H "$AUTH" > /dev/null
          curl -sf localhost:8080/v1/premises -H "$AUTH" > /dev/null
          curl -sf localhost:8080/static/admin/css/base.css > /dev/null
      - if: always()
        run: docker logs api || true

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.5
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  # The release APK, built as the deploy builds it but signed with the debug key, so a change that
  # breaks the Android build fails its PR instead of the deploy (docs/DEPLOY.md). Not on pushes to
  # main: the deploy builds that commit's APK itself, and its CI gate shouldn't wait for a second.
  android:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.5
          cache: true
      - run: infra/build-apk.sh "$RUNNER_TEMP/lucid-saga.apk"

  # Only dev merges into main, because that merge deploys. Every other PR goes into dev.
  into-main:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Only dev merges into main
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != dev ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::PRs go into dev, and only dev merges into main, which deploys. Change this PR's base branch to dev."
            exit 1
          fi

  # The deploy scripts and workflows (docs/DEPLOY.md). No credentials: gcloud, gh and curl are
  # fakes in the tests, and the real gcloud runs offline and signed out to check every flag.
  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck -x infra/*.sh infra/tests/*.sh infra/tests/fakes/*
      # Every workflow, with shellcheck on their scripts.
      - run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
      - run: infra/tests/run.sh
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - run: infra/tests/check-gcloud-flags.sh
