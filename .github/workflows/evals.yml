# The live story evals (WS17; T15, T17, T18): the real models on Vertex AI play every scenario and
# a model judge scores the scenes against written rubrics. By hand from main, and nightly once the
# repository variable EVALS_ENABLED is "true" (a full run costs $10 to $20). It signs in through
# Workload Identity Federation with no key (B11), as a service account that can call Vertex AI and
# nothing else, which infra/bootstrap.sh sets up (docs/ARCHITECTURE.md, "Story evals").
#
# A run by hand can draw its pictures with another model, to weigh it against today's on T18's
# picture evals before any switch (M8): run the same scenarios once with each and compare. The
# same goes for the model that reads the player's words and how hard it thinks (B6): the summary
# lists what each model step came to, a call and a turn, so two runs are set side by side.
#
# Each run uploads its results (run.json, summary.md, transcripts, pictures) and appends a line to
# history.jsonl, which is carried from run to run in the Actions cache and shown as a trend.
#
# A run by hand with `styles` plays no scenario: it draws the same scenes once in each candidate
# house style (backend/evals/styles.py, S7), for Miki to pick the look from, about $0.55, and also
# pushes the pictures to a branch of their own, style-samples/<run id>, for a thread that can't
# download the artifact. Delete that branch once the pictures are read. `candidates` draws a new
# round, today's style next to the JSON list it gives, with no code change.
#
# A run by hand with `play` plays no scenario either: it plays stories by hand, the steps it is
# given on each play it names (backend/evals/play.py), to read each scene before deciding the
# next move as a player does. A run's files don't outlive it, so the plays are kept on the `plays`
# branch: the run starts from the branch and a second job commits what it played on top, where a
# thread that can't download the artifact reads the transcripts with git. One run at a time. A run
# only ever adds to the branch or changes a play it played, and `plays_from` starts it from an
# earlier commit of the branch, to play a story again from before a move.

name: Evals
run-name: "Evals${{ inputs.play && ', played by hand' || '' }}${{ inputs.styles && ', house style candidates' || '' }}${{ inputs.picture_model && format(', pictures by {0}', inputs.picture_model) || '' }}${{ inputs.interpret_model && format(', read by {0}', inputs.interpret_model) || '' }}${{ inputs.interpret_thinking && format(', thinking {0}', inputs.interpret_thinking) || '' }}"

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: Scenario ids or id prefixes, separated by spaces (blank runs them all)
        type: string
        default: ""
      picture_model:
        description: The picture model to draw with, such as gemini-nano-banana-2.1 (blank is the default, M8)
        type: string
        default: ""
      interpret_model:
        description: The model that reads the player's words, such as gemini-3.5-flash (blank is the default, B6)
        type: string
        default: ""
      interpret_thinking:
        description: How hard that model thinks, minimal, low, medium or high (blank is the default)
        type: string
        default: ""
      styles:
        description: Draw one scene in each candidate house style instead of the scenarios (S7)
        type: boolean
        default: false
      candidates:
        description: With styles, a JSON list of candidates ({id, name, look or tweak}) to draw next to today's style (blank draws the built-in ones)
        type: string
        default: ""
      play:
        description: Play stories by hand instead of the scenarios, a JSON object of each play's name and its list of steps (backend/evals/play.py)
        type: string
        default: ""
      plays_from:
        description: With play, the commit of the plays branch to start from (blank is the branch as it stands)
        type: string
        default: ""

permissions: {}

concurrency:
  group: evals-live
  cancel-in-progress: false

jobs:
  live:
    name: Live evals
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.EVALS_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: backend
    env:
      LLM_PROVIDER: vertex
      GCP_PROJECT: ${{ vars.EVALS_GCP_PROJECT || 'playable-anime' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.EVALS_GCP_PROJECT || 'playable-anime' }}
          workload_identity_provider: ${{ vars.EVALS_WIF_PROVIDER || 'projects/528988811295/locations/global/workloadIdentityPools/github-evals/providers/playable-anime-evals' }}
          service_account: ${{ vars.EVALS_SERVICE_ACCOUNT || 'github-evals@playable-anime.iam.gserviceaccount.com' }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - run: uv sync --locked

      - name: Restore the history
        if: ${{ !inputs.play }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/evals-history
          key: evals-history-${{ github.run_id }}
          restore-keys: evals-history-

      - name: Run the evals
        if: ${{ !inputs.styles && !inputs.play }}
        env:
          ONLY: ${{ inputs.only }}
          # Blank keeps the configured model and thinking (graph.llm.config).
          PICTURE_MODEL: ${{ inputs.picture_model }}
          INTERPRET_MODEL: ${{ inputs.interpret_model }}
          INTERPRET_THINKING: ${{ inputs.interpret_thinking }}
        run: |
          args=()
          for scenario in $ONLY; do args+=(--only "$scenario"); done
          uv run python -m evals run --mode live --out evals-out \
            --history evals-history/history.jsonl "${args[@]}"

      - name: Draw the house style candidates
        if: ${{ inputs.styles && !inputs.play }}
        env:
          # Blank keeps the configured picture model (graph.llm.config).
          PICTURE_MODEL: ${{ inputs.picture_model }}
          CANDIDATES: ${{ inputs.candidates }}
        run: |
          args=()
          if [ -n "$CANDIDATES" ]; then args+=(--candidates "$CANDIDATES"); fi
          uv run python -m evals styles --out evals-out "${args[@]}"

      - name: Restore the plays
        if: ${{ inputs.play }}
        env:
          FROM: ${{ inputs.plays_from }}
        run: |
          # The plays so far, from their branch, or as they stood at the commit asked for. Only a
          # branch that isn't there yet is an empty start: one that couldn't be read stops the run.
          set -o pipefail
          mkdir -p plays
          found=0
          git ls-remote --exit-code --heads origin plays >/dev/null || found=$?
          case "$found" in
            0)
              git fetch -q origin plays
              from=FETCH_HEAD
              if [ -n "$FROM" ]; then
                if ! [[ "$FROM" =~ ^[0-9a-f]{7,40}$ ]] ||
                  ! git merge-base --is-ancestor "$FROM" FETCH_HEAD 2>/dev/null; then
                  echo "plays_from is a commit of the plays branch." >&2
                  exit 1
                fi
                from=$FROM
              fi
              # From the top of the repository: in a folder, git archives only that folder's
              # part of the tree, which the plays branch doesn't have.
              git -C "$GITHUB_WORKSPACE" archive "$from" | tar -x -C plays
              echo "Restored $(find plays -name play.json | wc -l) plays."
              ;;
            2)
              if [ -n "$FROM" ]; then
                echo "No plays branch yet: plays_from has nothing to start from." >&2
                exit 1
              fi
              echo "No plays branch yet: the first plays start it."
              ;;
            *)
              echo "The plays branch couldn't be read." >&2
              exit 1
              ;;
          esac

      - name: Play by hand
        if: ${{ inputs.play }}
        env:
          PLAYS: ${{ inputs.play }}
        # Each transcript is printed as it is played. A play is made up: no player's data.
        run: uv run python -m evals play --root plays --plays "$PLAYS"

      - name: Summary and trend
        if: ${{ !cancelled() && !inputs.play }}
        env:
          STYLES: ${{ inputs.styles }}
        run: |
          # In the log too, where a thread reads it. Eval stories are made up: no player's data.
          if [ -f evals-out/summary.md ]; then tee -a "$GITHUB_STEP_SUMMARY" <evals-out/summary.md; fi
          # A styles run plays no scenario, so it has no trend to show.
          if [ -f evals-history/history.jsonl ] && [ "$STYLES" != "true" ]; then
            # A run that broke before it wrote anything has no folder yet.
            mkdir -p evals-out
            cp evals-history/history.jsonl evals-out/
            {
              echo
              echo '### Trend (live runs)'
              echo
              echo '```'
              uv run python -m evals report --mode live --history evals-history/history.jsonl
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the history
        if: ${{ !cancelled() && !inputs.styles && !inputs.play && hashFiles('backend/evals-history/history.jsonl') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/evals-history
          key: evals-history-${{ github.run_id }}

      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evals-live-${{ github.run_id }}
          path: backend/evals-out
          if-no-files-found: ignore
          retention-days: 90

      # Also when a step of a play failed: its transcript says why, and the others played on.
      - name: Upload the plays
        if: ${{ !cancelled() && inputs.play && hashFiles('backend/plays/**') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plays-${{ github.run_id }}
          path: backend/plays
          retention-days: 90

  # A styles run's pictures on a branch of their own, so a thread that can't download the artifact
  # reads them with git. Eval stories are made up: no player's data.
  style-samples:
    name: Push the style samples to a branch
    needs: live
    if: ${{ inputs.styles }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evals-live-${{ github.run_id }}
          path: samples

      - name: Push them
        working-directory: samples
        env:
          BRANCH: style-samples/${{ github.run_id }}
          TOKEN: ${{ github.token }}
        run: |
          git init -q -b "$BRANCH"
          git add styles styles.json summary.md
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "House style candidates from Evals run $GITHUB_RUN_ID"
          # Forced, so a re-run of the same run replaces its own earlier push.
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/$BRANCH"
          echo "Pushed to $BRANCH"

  # A hand play's folders on the plays branch, so the next run goes on from them and a thread that
  # can't download the artifact reads the transcripts with git. A play is made up: no player's data.
  plays:
    name: Keep the plays on their branch
    needs: live
    if: ${{ !cancelled() && inputs.play && needs.live.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plays-${{ github.run_id }}
          path: plays

      - name: Commit them
        working-directory: plays
        env:
          TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git init -q -b plays
          # On top of the branch as it is, so its history says what each run played. A run adds
          # plays and changes the ones it played, and never takes one off the branch: a run that
          # started from nothing, or from an earlier commit, leaves the other plays as they are.
          found=0
          git ls-remote --exit-code --heads "$remote" plays >/dev/null || found=$?
          case "$found" in
            0)
              git fetch -q "$remote" plays
              git reset -q FETCH_HEAD
              ;;
            2) ;;
            *)
              echo "The plays branch couldn't be read." >&2
              exit 1
              ;;
          esac
          git add --ignore-removal .
          if git diff --cached --quiet HEAD 2>/dev/null; then
            echo "Nothing new was played."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Plays from Evals run $GITHUB_RUN_ID"
          git push -q "$remote" HEAD:refs/heads/plays
          echo "Pushed to plays"
