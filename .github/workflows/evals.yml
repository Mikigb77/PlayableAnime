# The live story evals (WS17; T15, T17, T18): the real models on Vertex AI play every scenario and
# a model judge scores the scenes against written rubrics. By hand from main, and nightly once the
# repository variable EVALS_ENABLED is "true" (a full run costs $10 to $20). It signs in through
# Workload Identity Federation with no key (B11), as a service account that can call Vertex AI and
# nothing else, which infra/bootstrap.sh sets up (docs/ARCHITECTURE.md, "Story evals").
#
# A run by hand can draw its pictures with another model, to weigh it against today's on T18's
# picture evals before any switch (M8): run the same scenarios once with each and compare.
#
# Each run uploads its results (run.json, summary.md, transcripts, pictures) and appends a line to
# history.jsonl, which is carried from run to run in the Actions cache and shown as a trend.
#
# A run by hand with `styles` plays no scenario: it draws the same scenes once in each candidate
# house style (backend/evals/styles.py, S7), for Miki to pick the look from, about $0.55, and also
# pushes the pictures to a branch of their own, style-samples/<run id>, for a thread that can't
# download the artifact. Delete that branch once the pictures are read. `candidates` draws a new
# round, today's style next to the JSON list it gives, with no code change.

name: Evals
run-name: "Evals${{ inputs.styles && ', house style candidates' || '' }}${{ inputs.picture_model && format(', pictures by {0}', inputs.picture_model) || '' }}"

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: Scenario ids or id prefixes, separated by spaces (blank runs them all)
        type: string
        default: ""
      picture_model:
        description: The picture model to draw with, such as gemini-nano-banana-2.1 (blank is the default, M8)
        type: string
        default: ""
      styles:
        description: Draw one scene in each candidate house style instead of the scenarios (S7)
        type: boolean
        default: false
      candidates:
        description: With styles, a JSON list of candidates ({id, name, look or tweak}) to draw next to today's style (blank draws the built-in ones)
        type: string
        default: ""

permissions: {}

concurrency:
  group: evals-live
  cancel-in-progress: false

jobs:
  live:
    name: Live evals
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.EVALS_ENABLED == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: backend
    env:
      LLM_PROVIDER: vertex
      GCP_PROJECT: ${{ vars.EVALS_GCP_PROJECT || 'playable-anime' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.EVALS_GCP_PROJECT || 'playable-anime' }}
          workload_identity_provider: ${{ vars.EVALS_WIF_PROVIDER || 'projects/528988811295/locations/global/workloadIdentityPools/github-evals/providers/playable-anime-evals' }}
          service_account: ${{ vars.EVALS_SERVICE_ACCOUNT || 'github-evals@playable-anime.iam.gserviceaccount.com' }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - run: uv sync --locked

      - name: Restore the history
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/evals-history
          key: evals-history-${{ github.run_id }}
          restore-keys: evals-history-

      - name: Run the evals
        if: ${{ !inputs.styles }}
        env:
          ONLY: ${{ inputs.only }}
          # Blank keeps the configured picture model (graph.llm.config).
          PICTURE_MODEL: ${{ inputs.picture_model }}
        run: |
          args=()
          for scenario in $ONLY; do args+=(--only "$scenario"); done
          uv run python -m evals run --mode live --out evals-out \
            --history evals-history/history.jsonl "${args[@]}"

      - name: Draw the house style candidates
        if: ${{ inputs.styles }}
        env:
          # Blank keeps the configured picture model (graph.llm.config).
          PICTURE_MODEL: ${{ inputs.picture_model }}
          CANDIDATES: ${{ inputs.candidates }}
        run: |
          args=()
          if [ -n "$CANDIDATES" ]; then args+=(--candidates "$CANDIDATES"); fi
          uv run python -m evals styles --out evals-out "${args[@]}"

      - name: Summary and trend
        if: ${{ !cancelled() }}
        env:
          STYLES: ${{ inputs.styles }}
        run: |
          # In the log too, where a thread reads it. Eval stories are made up: no player's data.
          if [ -f evals-out/summary.md ]; then tee -a "$GITHUB_STEP_SUMMARY" <evals-out/summary.md; fi
          # A styles run plays no scenario, so it has no trend to show.
          if [ -f evals-history/history.jsonl ] && [ "$STYLES" != "true" ]; then
            cp evals-history/history.jsonl evals-out/
            {
              echo
              echo '### Trend (live runs)'
              echo
              echo '```'
              uv run python -m evals report --mode live --history evals-history/history.jsonl
              echo '```'
            } >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the history
        if: ${{ !cancelled() && !inputs.styles && hashFiles('backend/evals-history/history.jsonl') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/evals-history
          key: evals-history-${{ github.run_id }}

      - name: Upload the results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evals-live-${{ github.run_id }}
          path: backend/evals-out
          if-no-files-found: ignore
          retention-days: 90

  # A styles run's pictures on a branch of their own, so a thread that can't download the artifact
  # reads them with git. Eval stories are made up: no player's data.
  style-samples:
    name: Push the style samples to a branch
    needs: live
    if: ${{ inputs.styles }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: evals-live-${{ github.run_id }}
          path: samples

      - name: Push them
        working-directory: samples
        env:
          BRANCH: style-samples/${{ github.run_id }}
          TOKEN: ${{ github.token }}
        run: |
          git init -q -b "$BRANCH"
          git add styles styles.json summary.md
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "House style candidates from Evals run $GITHUB_RUN_ID"
          # Forced, so a re-run of the same run replaces its own earlier push.
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/$BRANCH"
          echo "Pushed to $BRANCH"
